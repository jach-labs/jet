[project]
name = "jet"
version = "0.1.0"
description = "Train and serve a small, typed, calibrated decision model (choice / score / noul)"
readme = "README.md"
authors = [
    { name = "Michal Jach", email = "michaljach@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.3",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
# NVIDIA GPUs on Linux: uv sync --extra cuda
# MLX JIT-compiles CUDA kernels, so it also needs the CUDA headers (runtime + CCCL); train_cuda.sh points CUDA_HOME at them.
cuda = [
    "mlx[cuda]>=0.32.2; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12==12.9.*; sys_platform == 'linux'",
    "nvidia-cuda-cccl-cu12==12.9.*; sys_platform == 'linux'",
]

[project.scripts]
jet-data-public = "data.public:main"
jet-data-score-eval = "data.public:score_eval_main"
jet-distill = "data.distill:main"
jet-split = "data.split:main"
jet-extend = "data.split:extend_main"
jet-train = "train:main"
jet-calibrate = "evaluate:main_calibrate"
jet-eval = "evaluate:main_eval"
jet-serve = "server:main"
jet-fuse = "fuse:main"
jet-bench-jev = "bench_jev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modules live directly in src/ (from model import Jet), which uv_build's one-package layout can't express.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
